<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmação de Presença</title>
    <style>
        /* 
           ============================================================
           ÁREA DE PERSONALIZAÇÃO (MUDE AS CORES E IMAGEM ABAIXO)
           ============================================================
        */
        :root {
            /* 1. CORES DO FORMULÁRIO PRINCIPAL */
            --cor-principal: #89a054;       /* Cor do título e bordas de destaque */
            --cor-botao-whatsapp: #89a054; /* Cor do botão de confirmação */
            --cor-texto-botao: #ffffff;    /* Cor da letra dentro do botão */
            --cor-das-letras: #333333;     /* Cor geral dos textos do formulário */
            --cor-do-card: #ffffff;        /* Cor de fundo do cartão branco */
            
            /* 2. CORES DA TELA DE AGRADECIMENTO */
            --cor-titulo-obrigado: #89a054;  /* Cor do "Muito Obrigado!" */
            --cor-texto-obrigado: #555555;   /* Cor da mensagem de agradecimento */
            --cor-icone-sucesso: #25d366;    /* Cor do ícone de check/sucesso */

            /* 3. IMAGEM DE FUNDO */
            /* Coloque o link da sua imagem entre as aspas abaixo */
            --imagem-de-fundo: url('https://festejartsconvitesdigitais.online/wp-content/uploads/2026/07/Daniel-2.png');
        }
        /* ============================================================ */

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: var(--imagem-de-fundo);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.3);
            z-index: -1;
        }

        .card {
            background: var(--cor-do-card);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
            color: var(--cor-das-letras);
            position: relative;
            overflow: hidden;
        }

        /* Estilos do Formulário */
        #form-confirmacao {
            display: block;
        }

        h2 {
            color: var(--cor-principal);
            margin-bottom: 25px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 16px;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--cor-principal);
            outline: none;
        }

        .btn-confirm {
            background-color: var(--cor-botao-whatsapp);
            color: var(--cor-texto-botao);
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: 0.3s;
        }

        .btn-confirm:hover {
            filter: brightness(0.9);
            transform: scale(1.02);
        }

        .radio-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .radio-option {
            flex: 1;
            position: relative;
        }

        .radio-option input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }

        .radio-label {
            display: block;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .radio-option input:checked + .radio-label.sim {
            background-color: #c8e6c9;
            color: #2e7d32;
            border: 2px solid #2e7d32;
        }

        .radio-option input:checked + .radio-label.nao {
            background-color: #ffcdd2;
            color: #c62828;
            border: 2px solid #c62828;
        }

        /* Estilos da Tela de Agradecimento */
        #tela-agradecimento {
            display: none; /* Escondido por padrão */
            padding: 20px 0;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icone-sucesso {
            font-size: 60px;
            color: var(--cor-icone-sucesso);
            margin-bottom: 20px;
        }

        .titulo-agradecimento {
            color: var(--cor-titulo-obrigado);
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .texto-agradecimento {
            color: var(--cor-texto-obrigado);
            font-size: 18px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="card">
    <!-- 1. FORMULÁRIO DE PREENCHIMENTO -->
    <div id="form-confirmacao">
        <h2>Confirmação de Presença</h2>
        
        <div class="form-group">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" placeholder="Seu nome completo" required>
        </div>

        <div class="form-group">
            <label>Você confirma sua presença?</label>
            <div class="radio-group">
                <div class="radio-option">
                    <input type="radio" name="presenca" value="Sim" id="sim" checked>
                    <label for="sim" class="radio-label sim">SIM</label>
                </div>
                <div class="radio-option">
                    <input type="radio" name="presenca" value="Não" id="nao">
                    <label for="nao" class="radio-label nao">NÃO</label>
                </div>
            </div>
        </div>

        <div id="campos-extras">
            <div class="form-group">
                <label for="acompanhantes">Quantos acompanhantes?</label>
                <input type="number" id="acompanhantes" value="0" min="0">
            </div>

            <div class="form-group">
                <label for="nomes_acompanhantes">Nome dos acompanhantes:</label>
                <textarea id="nomes_acompanhantes" rows="2" placeholder="Ex: Maria, João..."></textarea>
            </div>
        </div>

        <button class="btn-confirm" onclick="enviarWhatsApp()">
            CONFIRMAR VIA WHATSAPP
        </button>
    </div>

    <!-- 2. TELA DE AGRADECIMENTO (SÓ APARECE DEPOIS) -->
    <div id="tela-agradecimento">
        <div class="icone-sucesso">✓</div>
        <div class="titulo-agradecimento">Muito Obrigado!</div>
        <div class="texto-agradecimento">
            Sua confirmação foi enviada com sucesso.<br>
            Aguardamos você no evento!
        </div>
    </div>
</div>

<script>
    const radioSim = document.getElementById('sim');
    const radioNao = document.getElementById('nao');
    const camposExtras = document.getElementById('campos-extras');
    const formConfirmacao = document.getElementById('form-confirmacao');
    const telaAgradecimento = document.getElementById('tela-agradecimento');

    radioSim.addEventListener('change', () => camposExtras.style.display = 'block');
    radioNao.addEventListener('change', () => camposExtras.style.display = 'none');

    function enviarWhatsApp() {
        // --- CONFIGURAÇÃO ---
        const numeroWhatsApp = "5511999999999"; // <--- COLOQUE SEU NÚMERO AQUI
        // --------------------

        const nome = document.getElementById('nome').value;
        const presenca = document.querySelector('input[name="presenca"]:checked').value;
        const acompanhantes = document.getElementById('acompanhantes').value;
        const nomesAcompanhantes = document.getElementById('nomes_acompanhantes').value;

        if (!nome) {
            alert("Por favor, preencha seu nome.");
            return;
        }

        // Formata a mensagem
        let mensagem = `*Confirmação de Presença*%0A%0A`;
        mensagem += `*Nome:* ${nome}%0A`;
        mensagem += `*Presença:* ${presenca}%0A`;

        if (presenca === "Sim") {
            mensagem += `*Acompanhantes:* ${acompanhantes}%0A`;
            if (nomesAcompanhantes) {
                mensagem += `*Nomes:* ${nomesAcompanhantes}%0A`;
            }
        }

        // URL do WhatsApp
        const url = `https://api.whatsapp.com/send?phone=${numeroWhatsApp}&text=${mensagem}`;
        
        // Abre o WhatsApp
        window.open(url, '_blank');

        // MOSTRA A TELA DE AGRADECIMENTO
        formConfirmacao.style.display = 'none';
        telaAgradecimento.style.display = 'block';
    }
</script>

</body>
</html>
